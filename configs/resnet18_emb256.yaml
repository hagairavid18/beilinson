mode:
  name: colab_training
  seed: 42
  build_artifacts: true

data:
  data_dir: data
  artifacts_dir: artifacts
  sequence_len: 16
  image_size: 224  # ImageNet-pretrained backbones expect ~224; only 'custom' tolerates smaller.
  batch_size: 32  # frozen backbone keeps GPU compute cheap; T4 has headroom above 16.
  num_workers: 2
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  manifest_name: sequence_manifest_len16.csv

model:
  # backbone: custom | resnet18 | mobilenet_v3_small | efficientnet_b0
  backbone: resnet18
  freeze_backbone: true  # only train the projection/classifier head on top of it
  in_channels: 3
  hidden_dims: [32, 64, 128]  # only used when backbone: custom
  embedding_dim: 256  # wider head than the default 128 - see artifacts/resnet18_emb256/
  dropout: 0.10  # backbone is frozen (tiny trainable head) - 0.20 was likely just slowing convergence.
  temporal_pooling: mean

training:
  lr: 0.001
  weight_decay: 0.0001
  lr_step_size: 10  # StepLR: multiply lr by lr_gamma every lr_step_size epochs
  lr_gamma: 0.5
  max_epochs: 30  # needs to be well above lr_step_size for the schedule to actually matter
  accelerator: auto
  devices: auto
  precision: 32-true
  log_every_n_steps: 10
  patience: 4
