exp_name: efficientnet_b0  # names this run's output folder, artifacts/<exp_name>/ - bump
                           # this (not the yaml filename) when you consider a change here
                           # a new experiment, so re-running Trainer.fit doesn't land in
                           # the same folder as a previous, different run.

mode:
  name: colab_training
  seed: 42
  build_artifacts: true

data:
  data_dir: data
  artifacts_dir: artifacts
  sequence_len: 16
  image_size: 224  # ImageNet-pretrained backbones expect ~224; only 'custom' tolerates smaller.
  batch_size: 32  # frozen backbone keeps GPU compute cheap; T4 has headroom above 16.
  num_workers: 2
  train_frac: 0.85
  val_frac: 0.15
  test_frac: 0.0  # no held-out test split - see artifacts/efficientnet_b0/ - val is the final evaluation set
  manifest_name: sequence_manifest_len16.csv
  augment: true  # train split only: per-epoch temporal jitter + random horizontal flip

model:
  # backbone: custom | resnet18 | mobilenet_v3_small | efficientnet_b0
  # Current best: 84.7% accuracy on the held-out split - see artifacts/efficientnet_b0/.
  backbone: efficientnet_b0
  freeze_backbone: false  # fine-tunes the whole backbone, not just the projection/classifier head
  in_channels: 3
  hidden_dims: [32, 64, 128]  # only used when backbone: custom
  embedding_dim: 128
  dropout: 0.20
  temporal_pooling: mean
  # classifier_hidden_dim: 128  # unset = single Linear(embedding_dim, num_classes) head;
                                 # set it to insert a hidden Linear+ReLU+Dropout layer first

training:
  lr: 0.001
  weight_decay: 0.001
  lr_step_size: 5  # StepLR: multiply lr by lr_gamma every lr_step_size epochs
  lr_gamma: 0.1
  max_epochs: 50  # needs to be well above lr_step_size for the schedule to actually matter
  accelerator: auto
  devices: auto
  precision: 32-true
  log_every_n_steps: 10
  patience: 4
  label_smoothing: 0.1  # softens targets - discourages driving predictions to overconfident near-100% train acc
  class_weighted_loss: true  # loss weighted by max_count/count per class (see training_utils.compute_class_weights) -
                              # addresses the ~6x class imbalance across the 22 exercise classes
