exp_name: efficientnet_b0_cv  # each fold's output folder is artifacts/<exp_name>_fold<i>/

mode:
  name: colab_training
  seed: 42
  build_artifacts: true

data:
  data_dir: data
  artifacts_dir: artifacts
  sequence_len: 16
  image_size: 224  # ImageNet-pretrained backbones expect ~224; only 'custom' tolerates smaller.
  batch_size: 32  # frozen backbone keeps GPU compute cheap; T4 has headroom above 16.
  num_workers: 2
  test_frac: 0.15  # held out, identical across every fold - train_frac/val_frac are ignored when n_folds is set
  n_folds: 5  # training_utils.run_kfold_sweep runs this 5x, injecting fold_index 0..4 automatically
  manifest_name: sequence_manifest_len16.csv
  augment: true  # train split only: per-epoch temporal jitter + random horizontal flip

model:
  # Same as the current SOTA config (configs/base.yaml, 73.5% val_acc single split) but
  # cross-validated across 5 folds - averages out the noise from one small, fixed val split.
  backbone: efficientnet_b0
  freeze_backbone: true  # only train the projection/classifier head on top of it
  in_channels: 3
  hidden_dims: [32, 64, 128]  # only used when backbone: custom
  embedding_dim: 256
  dropout: 0.20
  temporal_pooling: mean

training:
  lr: 0.001
  weight_decay: 0.0001
  lr_step_size: 10  # StepLR: multiply lr by lr_gamma every lr_step_size epochs
  lr_gamma: 0.5
  max_epochs: 30  # kept lower than base.yaml's 50 since this runs 5x
  accelerator: auto
  devices: auto
  precision: 32-true
  log_every_n_steps: 10
  patience: 4
